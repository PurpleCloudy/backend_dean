name: Backend checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and run focused unit checks
        run: |
          python -m pip install --constraint requirements.lock . ./references/dean-agent pytest pytest-asyncio
          python -m pytest -q
      - name: Configure explicit local model fixtures
        run: python scripts/local_config.py --fixture-providers
      - name: Build application and start real dependencies
        run: |
          docker compose --env-file .env.local build
          docker compose --env-file .env.local --profile verification up -d --wait --wait-timeout 600 postgres s3 qdrant clamav providers
      - name: Install new schema and synthetic sample
        run: docker compose --env-file .env.local run --rm migrate python scripts/initialize.py --synthetic
      - name: Start API, original agent and Linux worker
        run: docker compose --env-file .env.local up -d --wait --wait-timeout 600 api agent worker
      - name: Real HTTP smoke
        run: |
          python scripts/smoke.py
          python tests/adversarial_auth.py
      - name: Container diagnostics
        if: always()
        run: docker compose --env-file .env.local logs --no-color > container-diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-checks
          path: |
            .local/test-results/*.json
            container-diagnostics.log
          retention-days: 7
      - name: Stop CI services
        if: always()
        run: docker compose --env-file .env.local down

[project]
name = "dean-agent"
version = "0.1.0"
description = "Assistant for dean's office data with controlled PostgreSQL tools"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "deepagents>=0.7,<1",
  "fastapi>=0.115,<1",
  "langchain-openai>=0.3,<2",
  "pglast>=8,<9",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.15,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dean_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

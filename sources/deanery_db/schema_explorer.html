<style>
/* Layout: catalog rail on the left (tables grouped by block, same colors as the ER diagram),
   selected table on the right: relation map → attributes → constraints. */
:root {
  --bg: #F3F5F8;
  --panel: #FFFFFF;
  --ink: #18202B;
  --muted: #5E6A7B;
  --line: #DCE1E8;
  --soft: #EBEEF3;
  --accent: #1F4E8C;
  --pk: #A15C00;
  --pk-bg: #FFF1DC;
  --fk: #0B6E62;
  --fk-bg: #DDF3EF;
  --uq: #6440A8;
  --uq-bg: #EEE8FA;
  --b-people: #2F7A4A; --b-org: #3F7F5F; --b-programs: #A66A00; --b-process: #1F5FA8;
  --b-practice: #0F7B6C; --b-orders: #A33A3A; --b-agent: #6440A8; --b-dict: #5B6B82; --b-views: #37474F;
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161D; --panel: #18202A; --ink: #E6EAF0; --muted: #98A3B3; --line: #2A3441; --soft: #202A36;
    --accent: #7FA8E6; --pk: #F0B45C; --pk-bg: #3A2A12; --fk: #5ED1BF; --fk-bg: #10322D; --uq: #B79AF0; --uq-bg: #2B2140;
    --b-people: #6FC08E; --b-org: #7DB89A; --b-programs: #E0A640; --b-process: #6FA2E8;
    --b-practice: #5ED1BF; --b-orders: #E88585; --b-agent: #A98BE6; --b-dict: #9AA9BF; --b-views: #A7B6BF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161D; --panel: #18202A; --ink: #E6EAF0; --muted: #98A3B3; --line: #2A3441; --soft: #202A36;
  --accent: #7FA8E6; --pk: #F0B45C; --pk-bg: #3A2A12; --fk: #5ED1BF; --fk-bg: #10322D; --uq: #B79AF0; --uq-bg: #2B2140;
  --b-people: #6FC08E; --b-org: #7DB89A; --b-programs: #E0A640; --b-process: #6FA2E8;
  --b-practice: #5ED1BF; --b-orders: #E88585; --b-agent: #A98BE6; --b-dict: #9AA9BF; --b-views: #A7B6BF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; display: grid; gap: 22px; }
code, .mono { font-family: var(--f-mono); }

header { display: grid; gap: 14px; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 600 clamp(22px, 3.2vw, 32px)/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 14px; }
.stats b { color: var(--ink); font: 600 16px var(--f-mono); font-variant-numeric: tabular-nums; margin-right: 4px; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; gap: 7px; align-items: center; }

.badge { display: inline-block; font: 600 10.5px/1 var(--f-mono); letter-spacing: .04em; padding: 4px 5px 3px; border-radius: 4px; }
.b-pk { color: var(--pk); background: var(--pk-bg); }
.b-fk { color: var(--fk); background: var(--fk-bg); }
.b-uq { color: var(--uq); background: var(--uq-bg); }
.req { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); display: inline-block; }
.opt { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px);
  overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
#q { width: 100%; font: 14px var(--f-body); padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--bg); color: var(--ink); }
#q:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.grp { margin-top: 14px; }
.grp h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; padding-inline: 6px;
  font: 600 11.5px/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.grp button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: flex; justify-content: space-between;
  gap: 8px; padding: 5px 8px; border-radius: 6px; font: 13.5px/1.35 var(--f-mono); color: var(--ink); }
.grp button small { color: var(--muted); font: 12px var(--f-mono); font-variant-numeric: tabular-nums; }
.grp button:hover { background: var(--soft); }
.grp button:focus-visible { outline: 2px solid var(--accent); }
.grp button[aria-current="true"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--c); font-weight: 600; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 6px; }

main { display: grid; gap: 18px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.tname { font: 600 clamp(22px, 2.6vw, 28px)/1.2 var(--f-mono); margin: 0; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--c); font-weight: 600; }
.desc { margin: 6px 0 0; font-size: 16px; max-width: 70ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }

h2 { font: 600 13px/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.map-scroll { overflow-x: auto; }
svg.map { display: block; min-width: 640px; width: 100%; height: auto; }
svg.map text { font-family: var(--f-mono); font-size: 12.5px; fill: var(--ink); }
svg.map .lbl { font-size: 11px; fill: var(--muted); }
svg.map .node { cursor: pointer; }
svg.map .node rect { fill: var(--panel); stroke-width: 1.4; }
svg.map .node:hover rect, svg.map .node:focus rect { fill: var(--soft); }
svg.map .node:focus { outline: none; }
svg.map .center rect { stroke-width: 2.2; }
svg.map path { fill: none; stroke: var(--line); stroke-width: 1.6; }
.map-note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 600 11.5px/1.2 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.keys { white-space: nowrap; width: 1%; }
td.keys .badge + .badge { margin-left: 3px; }
td.col { font: 500 13.5px var(--f-mono); white-space: nowrap; }
td.col.is-pk { color: var(--pk); font-weight: 600; }
td.type { font: 12.5px var(--f-mono); color: var(--muted); white-space: nowrap; }
td.null { text-align: center; width: 1%; }
td.ref { min-width: 190px; }
td.desc-cell { min-width: 200px; }
.link { all: unset; cursor: pointer; font: 500 13px var(--f-mono); color: var(--fk); border-bottom: 1px dashed currentColor; }
.link:hover { border-bottom-style: solid; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ref small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.card-lite { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 6px; font-family: var(--f-mono); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list code { font-size: 12.5px; background: var(--soft); padding: 5px 8px; border-radius: 5px; display: block; overflow-wrap: anywhere; }
.refby { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 5px 9px; border-radius: 6px;
  border: 1px solid var(--line); font: 12.5px var(--f-mono); color: var(--ink); }
.pill:hover { background: var(--soft); }
.pill:focus-visible { outline: 2px solid var(--accent); }
.pill span { color: var(--muted); }
.none { color: var(--muted); font-size: 13.5px; margin: 0; }

.explain { display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); margin: 0; padding-left: 18px; }
.explain b { color: var(--ink); font-weight: 600; }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; max-height: 300px; }
  .wrap { padding-inline: 16px; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .grp button, .pill, svg.map .node rect { transition: background-color .15s, fill .15s; }
}
</style>

    <div class="eyebrow">PostgreSQL 16 · схема deanery · НФБК · МГТУ «СТАНКИН»</div>

    </aside>
    <main id="detail"></main>
  </div>
</div>

<script>
const S = JSON.parse(document.getElementById('schema').textContent);
const T = Object.fromEntries(S.tables.map(t => [t.name, t]));
const V = Object.fromEntries(S.views.map(v => [v.name, v]));
const blockOf = {};
S.blocks.forEach(([key, title, _c, names]) => names.forEach(n => blockOf[n] = { key, title }));
S.views.forEach(v => blockOf[v.name] = { key: 'views', title: 'Представления (просмотр)' });
const col = n => `var(--b-${blockOf[n]?.key || 'dict'})`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
};
document.getElementById('stats').innerHTML = [
  [S.stats.tables, plural(S.stats.tables, 'таблица', 'таблицы', 'таблиц')],
  [S.stats.columns, plural(S.stats.columns, 'атрибут', 'атрибута', 'атрибутов')],
  [S.stats.fks, plural(S.stats.fks, 'внешний ключ', 'внешних ключа', 'внешних ключей')],
  [S.stats.views, plural(S.stats.views, 'представление', 'представления', 'представлений')],
].map(([n, w]) => `<span><b>${n}</b>${w}</span>`).join('');

function shortType(t, identity) {
  let s = t.replace('character varying', 'varchar').replace('timestamp with time zone', 'timestamptz')
    .replace('time without time zone', 'time').replace(/^character\(/, 'char(').replace('integer', 'int');
  return identity ? s + ' · identity' : s;
}
const DEL = {
  'CASCADE': 'удаляется вместе с родителем',
  'SET NULL': 'при удалении родителя станет пустым',
  'RESTRICT': 'запрещает удалить родителя',
  'NO ACTION': 'запрещает удалить родителя',
};

// ---------- sidebar ----------
const nav = document.getElementById('nav');
function renderNav(filter = '') {
  const f = filter.trim().toLowerCase();
  const match = n => {
    if (!f) return true;
    const t = T[n] || V[n];
    if (n.includes(f) || (t.comment || '').toLowerCase().includes(f)) return true;
    const cols = t.columns || [];
    return cols.some(c => typeof c === 'string' ? c.includes(f)
      : c.name.includes(f) || (c.comment || '').toLowerCase().includes(f));
  };
  const groups = [...S.blocks.map(([key, title, _c, names]) => [key, title, names]),
                  ['views', 'Представления (просмотр)', S.views.map(v => v.name)]];
  let html = '';
  for (const [key, title, names] of groups) {
    const items = names.filter(match);
    if (!items.length) continue;
    html += `<div class="grp"><h3><span class="dot" style="background:var(--b-${key})"></span>${esc(title)}</h3>` +
      items.map(n => `<button data-go="${n}" style="--c:var(--b-${key})" ${n === current ? 'aria-current="true"' : ''}>
        <span>${n}</span><small>${(T[n] || V[n]).columns.length}</small></button>`).join('') + '</div>';
  }
  nav.innerHTML = html || '<p class="empty">Ничего не найдено. Попробуйте имя столбца, например record_book.</p>';
}
document.getElementById('q').addEventListener('input', e => renderNav(e.target.value));

// ---------- relation map (parents ← table → children) ----------
function relationMap(t) {
  const parents = [...new Map(t.columns.filter(c => c.fk && c.fk.table !== t.name)
    .map(c => [c.fk.table + '|' + c.name, { table: c.fk.table, label: c.name }])).values()];
  const self = t.columns.filter(c => c.fk && c.fk.table === t.name);
  const children = t.referenced_by.filter(r => r.table !== t.name).map(r => ({ table: r.table, label: r.column }));
  const rowH = 50, W = 780, nodeW = 200, pad = 16;
  const n = Math.max(parents.length, children.length, 1);
  const H = n * rowH + pad * 2 + 24;
  const yFor = (i, count) => pad + 18 + (H - pad * 2 - 18 - count * rowH) / 2 + i * rowH + rowH / 2;
  const cx = W / 2, cy = pad + 18 + (H - pad * 2 - 18) / 2;
  const node = (x, y, name, cls = '') => `
    <g class="node ${cls}" data-go="${name}" tabindex="0" role="link" aria-label="Открыть ${name}">
      <rect x="${x - nodeW / 2}" y="${y - 13}" width="${nodeW}" height="26" rx="5" style="stroke:${col(name)}"></rect>
      <text x="${x}" y="${y + 4}" text-anchor="middle">${name}</text></g>`;
  let s = `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Связи таблицы ${t.name}">`;
  s += `<text class="lbl" x="${nodeW / 2 + 8}" y="${pad + 4}" text-anchor="middle">ссылается на (родители)</text>`;
  s += `<text class="lbl" x="${W - nodeW / 2 - 8}" y="${pad + 4}" text-anchor="middle">ссылаются на неё (дочерние)</text>`;
  const lx = nodeW / 2 + 8, rx = W - nodeW / 2 - 8;
  parents.forEach((p, i) => {
    const y = yFor(i, parents.length);
    s += `<path d="M${lx + nodeW / 2} ${y} C ${cx - 150} ${y}, ${cx - 150} ${cy}, ${cx - nodeW / 2} ${cy}"></path>`;
  });
  children.forEach((c, i) => {
    const y = yFor(i, children.length);
    s += `<path d="M${cx + nodeW / 2} ${cy} C ${cx + 150} ${cy}, ${cx + 150} ${y}, ${rx - nodeW / 2} ${y}"></path>`;
  });
  parents.forEach((p, i) => {
    const y = yFor(i, parents.length);
    s += node(lx, y, p.table) + `<text class="lbl" x="${lx + nodeW / 2 - 4}" y="${y - 17}" text-anchor="end">${p.label}</text>`;
  });
  children.forEach((c, i) => {
    const y = yFor(i, children.length);
    s += node(rx, y, c.table) + `<text class="lbl" x="${rx - nodeW / 2 + 4}" y="${y - 17}">${c.label}</text>`;
  });
  s += node(cx, cy, t.name, 'center');
  if (!parents.length) s += `<text class="lbl" x="${lx}" y="${cy + 4}" text-anchor="middle">нет</text>`;
  if (!children.length) s += `<text class="lbl" x="${rx}" y="${cy + 4}" text-anchor="middle">нет</text>`;
  s += '</svg>';
  let note = '';
  if (self.length) note = `<p class="map-note">Есть ссылка на саму себя: ${self.map(c => `<code>${c.name}</code>`).join(', ')}.</p>`;
  return s + note;
}

function cardinality(t, c) {
  if (c.unique) return '1 : 1';
  if (t.pk_cols && t.pk_cols.length > 1 && t.pk_cols.includes(c.name)) return 'часть M : N';
  if (c.pk) return '1 : 1';
  return 'N : 1';
}

function tableDetail(t) {
  const b = blockOf[t.name];
  const pk = t.pk_cols || [];
  const fkCount = t.columns.filter(c => c.fk).length;
  const rows = t.columns.map(c => {
    const keys = (c.pk ? '<i class="badge b-pk">PK</i>' : '') + (c.fk ? '<i class="badge b-fk">FK</i>' : '')
      + (c.unique ? '<i class="badge b-uq">UQ</i>' : '');
    const ref = c.fk ? `<button class="link" data-go="${c.fk.table}">${c.fk.table}.${c.fk.column}</button>
        <span class="card-lite">${cardinality(t, c)}</span>
        <small>ON DELETE ${c.fk.on_delete}: ${DEL[c.fk.on_delete]}</small>` : '';
    const def = c.default && !c.identity ? `<br><small class="mono" style="color:var(--muted)">по умолчанию ${esc(c.default)}</small>` : '';
    return `<tr><td class="keys">${keys}</td><td class="col ${c.pk ? 'is-pk' : ''}">${c.name}</td>
      <td class="type">${esc(shortType(c.type, c.identity))}</td>
      <td class="null">${c.notnull ? '<i class="req" title="обязательное"></i>' : '<i class="opt" title="может быть пустым"></i>'}</td>
      <td class="desc-cell">${esc(c.comment)}${def}</td><td class="ref">${ref}</td></tr>`;
  }).join('');

  const uniques = (t.uniques || []).map(u => `<li><code>UNIQUE (${u.join(', ')})</code></li>`).join('');
  const checks = (t.checks || []).map(c => `<li><code>${esc(c)}</code></li>`).join('');
  const idx = (t.indexes || []).map(i => `<li><code>${i}</code></li>`).join('');
  const trg = (t.triggers || []).map(i => `<li><code>${i}</code></li>`).join('');
  const refby = t.referenced_by.length
    ? `<div class="refby">${t.referenced_by.map(r => `<button class="pill" data-go="${r.table}">${r.table}<span>.${r.column}</span></button>`).join('')}</div>`
    : '<p class="none">На эту таблицу никто не ссылается.</p>';

  return `
  <section class="card" style="--c:${col(t.name)}">
    <div class="title-row"><h2 class="tname" style="text-transform:none;letter-spacing:0;color:var(--ink);margin:0">${t.name}</h2>
      <span class="chip"><span class="dot" style="background:var(--c)"></span>${esc(b.title)}</span></div>
    <p class="desc">${esc(t.comment)}</p>
    <div class="meta">
      <span>Первичный ключ: <b class="mono">${pk.length ? pk.join(' + ') : '—'}</b>${pk.length > 1 ? ' (составной)' : ''}</span>
      <span>Атрибутов: <b>${t.columns.length}</b></span>
      <span>Внешних ключей: <b>${fkCount}</b></span>
      <span>Строк в тестовых данных: <b>${t.rows}</b></span>
    </div>
  </section>
  <section class="card"><h2>Связи</h2><div class="map-scroll">${relationMap(t)}</div></section>
  <section class="card"><h2>Атрибуты</h2><div class="tbl-scroll"><table>
    <thead><tr><th>Ключ</th><th>Атрибут</th><th>Тип</th><th title="Обязательность">Обяз.</th><th>Описание</th><th>Ссылается на</th></tr></thead>
    <tbody>${rows}</tbody></table></div></section>
  <div class="two">
    <section class="card"><h2>На неё ссылаются</h2>${refby}</section>
    <section class="card"><h2>Ограничения</h2>
      ${uniques || checks ? `<ul class="list">${uniques}${checks}</ul>` : '<p class="none">Кроме ключей и NOT NULL ограничений нет.</p>'}
    </section>
    ${idx || trg ? `<section class="card"><h2>Индексы и триггеры</h2><ul class="list">${idx}${trg}</ul></section>` : ''}
  </div>`;
}

function viewDetail(v) {
  return `
  <section class="card" style="--c:var(--b-views)">
    <div class="title-row"><h2 class="tname" style="text-transform:none;letter-spacing:0;color:var(--ink);margin:0">${v.name}</h2>
      <span class="chip"><span class="dot" style="background:var(--c)"></span>Представление</span></div>
    <p class="desc">${esc(v.comment)}</p>
    <div class="meta"><span>Представление не хранит данные: это сохранённый SELECT, который собирает их из таблиц при каждом обращении.</span></div>
  </section>
  <section class="card"><h2>Собирается из таблиц</h2><div class="refby">
    ${(v.sources || []).map(s => `<button class="pill" data-go="${s}">${s}</button>`).join('')}</div></section>
  <section class="card"><h2>Столбцы (${v.columns.length})</h2><div class="refby">
    ${v.columns.map(c => `<span class="pill" style="cursor:default">${c}</span>`).join('')}</div>
    <p class="map-note">Пример: <code>SELECT * FROM deanery.${v.name};</code></p></section>`;
}

function howToRead() {
  return `<section class="card"><h2>Как устроены связи</h2><ol class="explain">
    <li><b>person</b> хранит паспорт, СНИЛС и контакты один раз. <b>student</b>, <b>employee</b> и <b>app_user</b> ссылаются на неё связью 1 : 1.</li>
    <li><b>teacher</b> и <b>dean_office_staff</b> — подтипы <b>employee</b>: их первичный ключ одновременно внешний.</li>
    <li>Группа ссылается на учебный план, поэтому направление, форма обучения и год набора в группе не дублируются. Курс вычисляется.</li>
    <li>Шифр группы (например, <b>ИДБ-24-11</b>) составлен по правилам СТАНКИНа: буквы института, формы и уровня хранятся в справочниках, а триггер проверяет, что шифр соответствует учебному плану группы.</li>
    <li>Таблицы-связки M : N (<b>order_student</b>, <b>control_type_grade</b>) имеют составной первичный ключ из двух внешних.</li>
    <li><b>specialty</b> (код ФГОС → название, уровень) и <b>study_program</b> (профиль) разделены: у одного направления может быть несколько профилей.</li>
    <li>Операция и целевая таблица агента зависят от намерения, поэтому лежат в <b>agent_intent</b>, а <b>agent_request</b> ссылается на него.</li>
    <li>Правила, которые связывают несколько таблиц (студент из группы ведомости, староста из своей группы, нет накладок в расписании), проверяют триггеры — у таблицы они перечислены в блоке «Индексы и триггеры».</li>
    <li>Любое изменение рабочих данных записывается в <b>audit_log</b> и <b>audit_log_detail</b>: кто, когда, какое поле и по какому запросу агента.</li>
  </ol></section>`;
}

// ---------- routing ----------
let current = null;
const detail = document.getElementById('detail');
function go(name, push = true) {
  if (!T[name] && !V[name]) name = 'student';
  current = name;
  detail.innerHTML = T[name] ? tableDetail(T[name]) + (name === 'student' || name === 'person' ? howToRead() : '') : viewDetail(V[name]);
  renderNav(document.getElementById('q').value);
  if (push) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }
  const btn = nav.querySelector(`[data-go="${name}"]`);
  if (btn && push) btn.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go]');
  if (!el) return;
  go(el.dataset.go);
  if (!el.closest('aside')) window.scrollTo({ top: detail.offsetTop - 12, behavior: 'smooth' });
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('svg .node')) { e.preventDefault(); go(e.target.dataset.go); }
});
go(location.hash.slice(1) || 'student', false);
</script>
